    <!-- WordPress Fetch Script -->
    <script>
        const WP_SITE = 'samtaffet.wordpress.com';

        const ENDPOINTS = [
            `https://public-api.wordpress.com/rest/v1.1/sites/${WP_SITE}/posts/?number=10`,
            `https://${WP_SITE}/wp-json/wp/v2/posts?per_page=10&_embed`
        ];

        async function fetchPosts() {
            const container = document.getElementById('posts-container');
            let postsData = null;

            for (const url of ENDPOINTS) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        postsData = data.posts || data;
                        break;
                    }
                } catch (e) {
                    console.warn(`Fetch failed for endpoint: ${url}`, e);
                }
            }

            if (!postsData || !Array.isArray(postsData) || postsData.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7;">No posts found or unable to load posts right now.</p>';
                return;
            }

            container.innerHTML = postsData.map(post => {
                const rawDate = post.date || post.modified;
                const date = new Date(rawDate).toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                });

                const title = post.title?.rendered || post.title || 'Untitled';
                const link = post.URL || post.link || '#';
                const excerpt = post.excerpt?.rendered || post.excerpt || '';

                return `
                    <article class="post-card">
                      <h3 class="post-title">
                        <a href="${link}" target="_blank" rel="noopener noreferrer">${title}</a>
                      </h3>
                      <div class="post-date">${date}</div>
                      <div class="post-excerpt">${excerpt}</div>
                      <a class="read-more" href="${link}" target="_blank" rel="noopener noreferrer">Read more &rarr;</a>
                    </article>
                  `;
            }).join('');
        }

        fetchPosts();
    </script>
